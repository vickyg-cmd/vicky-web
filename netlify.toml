[build]
  command = "npm run build"
  publish = "dist"

# One canonical host: vickygonzalezmalave.netlify.app, without www.
[[redirects]]
  from = "https://www.vickygonzalezmalave.netlify.app/*"
  to = "https://vickygonzalezmalave.netlify.app/:splat"
  status = 301
  force = true

# Astro fingerprints everything in /_astro/, so a changed file gets a new name
# and these can be cached for good.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images keep their names when they change, so a week, not forever.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security headers that cost nothing and can't break a working page. No
# script-src on purpose: see LESSONS.md before adding one.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
